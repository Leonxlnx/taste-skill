<!doctype html>
<html lang="en" data-type="software" data-buttons="solid">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pier Nine · Harbour schedule</title>
<link rel="stylesheet" href="../system.css"><link rel="stylesheet" href="layout.css">
<style>
:root { --p-bg: #f6f5f0; --p-ink: #182d36; --p-muted: #425661; --p-surface: #e4eae8; --p-action: #17483d; --p-action-ink: #fff; }

</style></head><body>
<header class="nav"><div class="wrap nav__bar"><a class="nav__logo" href="#top">Pier Nine</a><div class="nav__actions"><a class="nav__link" href="#schedule">Friday’s schedule</a></div></div></header>
<main>
<!-- One product window. Copy the section into the starter and use the working record from the brief. -->
<section class="hero hero--centred hero--peek" data-view="wide" id="top" aria-labelledby="schedule-title">
  <div class="wrap"><div class="hero-text">
    <div class="hero__c">
      <h1 id="schedule-title">The next shift at Pier Nine</h1>
      <p class="hero__lead">Follow the Wren from arrival to release on one harbour schedule.</p>
      <div class="btn-row"><a class="btn btn--primary" href="#schedule">View the schedule</a></div>
    </div>
    <div class="hero__window work-board" id="schedule" aria-label="Wren’s port call">
      <div class="work-board__head"><strong>Wren · Pier Nine</strong><span>Friday, 12 June</span></div>
      <dl>
        <div style="--start:0%;--length:40%"><dt>Arrival</dt><dd><span>06:30–09:00</span></dd></div>
        <div style="--start:32%;--length:30%"><dt>Inspection</dt><dd><span>08:30–10:15</span></dd></div>
        <div style="--start:65%;--length:30%"><dt>Release</dt><dd><span>11:00–12:45</span></dd></div>
      </dl>
    </div>
  </div></div>
</section>
</main></body></html>
