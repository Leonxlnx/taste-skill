<style>
[data-own="field-roster"] {
  & .wrap > .t-lead { margin: var(--s-4) 0 var(--head-gap); }
  & .definitions { position: absolute; width: 0; height: 0; }
  & .portraits { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: var(--s-2); margin-bottom: var(--s-5); }
  & button { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--s-2); padding: var(--s-2); padding-bottom: var(--s-3); min-height: var(--btn-h); border: 0; border-bottom: 1px solid var(--line); color: var(--muted); background: transparent; cursor: pointer; }
  & button svg { width: var(--s-7); }
  & button[aria-selected="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  & .dossier { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gutter); margin-bottom: var(--s-5); }
  & .profile { grid-column: span 5; padding: var(--s-5); border-top: 1px solid var(--line); }
  & .profile p { margin-top: var(--s-2); color: var(--muted); }
  & fieldset, & .single { margin: var(--s-5) 0 0; padding: 0; border: 0; }
  & legend { padding: 0; margin-bottom: var(--s-2); }
  & label { display: inline-flex; gap: var(--s-2); min-height: var(--btn-h); align-items: center; margin-inline-end: var(--s-2); cursor: pointer; }
  & input { margin: 0; accent-color: var(--ink); }
  & .poses { grid-column: span 7; }
  & figure svg { width: 100%; background: var(--surface); border-radius: var(--r-md); }
  & figcaption { display: flex; flex-wrap: wrap; gap: var(--s-1) var(--s-3); padding-block: var(--s-3); }
  & figcaption b { font-weight: 600; }
  @media (max-width: 639px) { & .dossier { grid-template-columns: 1fr; } & .profile, & .poses { grid-column: 1; } & .profile { padding: var(--s-3) 0; } }
  @media (max-width: 639px) {
    & .portraits button { flex-direction: column; gap: var(--s-1); }
    & .profile { border-top: 0; }
  }
  & figcaption { align-items: baseline; }
  & .poses svg { border: 1px solid var(--line); }
}
</style>

<script type="module">
for (const root of document.querySelectorAll('[data-own="field-roster"]')) {
  if (root.hasAttribute('data-ready')) continue;
  // Keep public anchors stable on the first instance and scope a repeated copy.
  if (document.getElementById(root.id) !== root) {
    const prefix = 'instance-' + [...document.querySelectorAll('[data-own="' + root.dataset.own + '"]')].indexOf(root) + '-';
    const nodes = [root, ...root.querySelectorAll('*')];
    const ids = new Set(nodes.map(node => node.id).filter(Boolean));
    for (const node of nodes) {
      if (node.id) node.id = prefix + node.id;
      for (const attr of ['href','for','aria-controls','aria-labelledby','aria-describedby']) {
        const value = node.getAttribute(attr);
        if (ids.has(value)) node.setAttribute(attr, prefix + value);
        if (value?.startsWith('#') && ids.has(value.slice(1))) node.setAttribute(attr, '#' + prefix + value.slice(1));
      }
    }
  }
  const one = selector => root.querySelector(selector);
  const all = selector => [...root.querySelectorAll(selector)];
  const tabs = all('[role="tab"]');
  const dossiers = all('.dossier');
  function action(panel, index) {
    [...panel.querySelectorAll('figure')].forEach((figure, i) => figure.hidden = i !== index);
  }
  function courier(index) {
    dossiers.forEach((panel, i) => {
      panel.hidden = index !== i;
      panel.setAttribute('role', 'tabpanel');
      panel.setAttribute('aria-labelledby', tabs[i].id);
      tabs[i].tabIndex = index === i ? 0 : -1;
      tabs[i].setAttribute('aria-selected', String(index === i));
    });
    const selected = dossiers[index];
    const first = selected.querySelector('input');
    if (first) first.checked = true;
    action(selected, 0);
  }
  function bindTabs(tabs, activate) {
    tabs.forEach((tab, i) => {
      tab.onclick = () => activate(i);
      tab.onkeydown = event => {
        const next = {ArrowLeft:(i + tabs.length - 1) % tabs.length, ArrowRight:(i + 1) % tabs.length, Home:0, End:tabs.length - 1}[event.key];
        if (next === undefined) return;
        event.preventDefault();
        activate(next);
        tabs[next].focus();
      };
    });
  }
  for (const panel of dossiers) {
    const group = panel.querySelector('fieldset');
    if (!group) continue;
    const name = 'action-' + crypto.randomUUID();
    for (const input of group.querySelectorAll('input')) input.name = name;
    group.onchange = event => action(panel, Number(event.target.value));
    group.hidden = false;
  }
  bindTabs(tabs, courier);
  courier(0);
  one('.portraits').hidden = false;
  root.dataset.ready = '';
}
</script>
