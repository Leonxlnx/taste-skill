<section class="section own" id="bars" data-own="bars" aria-labelledby="bars-title">
  <div class="wrap">
    <h2 id="bars-title">Packing a box of six</h2>
    <p class="t-lead measure">Pith & Parcel tested a fold-in divider against six loose sleeves for its small-batch vinegar bottles.</p>
    <figure class="packing" data-assumed>
      <div class="difference"><strong class="t-h1">45 sec</strong><span>less packing time per box</span></div>
      <div class="times">
        <div class="bar-label"><span>Loose sleeves</span><b>90 seconds</b></div><div class="length" aria-hidden="true"><i></i></div>
        <div class="bar-label"><span>Fold-in divider</span><b>45 seconds</b></div><div class="length" aria-hidden="true"><i></i></div>
      </div>
      <figcaption>Sample trial · Median time for 20 boxes per method, with the same bottles and packer.</figcaption>
    </figure>
  </div>
</section>

<style>
[data-own="bars"] .wrap > h2 + .t-lead { margin-top: var(--s-4); }
[data-own="bars"] .wrap > .t-lead + * { margin-top: var(--head-gap); }
[data-own="bars"] .packing { display: grid; grid-template-columns: 1fr 2fr; gap: var(--s-6) var(--s-8); align-items: center; font-variant-numeric: tabular-nums; padding-top: var(--s-5); border-top: 1px solid var(--line); }
[data-own="bars"] .difference { display: grid; gap: var(--s-2); }
[data-own="bars"] .difference strong { font-family: var(--font-display); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); }
[data-own="bars"] .difference span { font-size: var(--t-lead); }
[data-own="bars"] .bar-label { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-2); }
[data-own="bars"] .bar-label b { font-weight: 500; }
[data-own="bars"] .length { margin-top: var(--s-2); height: var(--s-6); background: var(--surface); }
[data-own="bars"] .length i { display: block; height: 100%; background: var(--ink); }
[data-own="bars"] .length + .bar-label { margin-top: var(--s-5); }
[data-own="bars"] .length:last-child i { width: 50%; background: var(--action); }
[data-own="bars"] figcaption { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: var(--s-3); color: var(--muted); font-size: var(--t-small); }
@media (max-width: 639px) { [data-own="bars"] .packing { grid-template-columns: 1fr; gap: var(--s-5); } }
</style>
