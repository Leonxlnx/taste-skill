<!doctype html>
<!-- Three editorial entries with distinct subjects and identifying thumbnails. Desktop and phone section heights in the second comparison: 729px at 1440; 748px at 390. The content stays inside the kit gutters. -->
<html lang="en" data-type="place" data-radius="sharp">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>From the roastery · Birchroom</title>
    <meta name="description" content="From the roastery at Birchroom." />
    <meta name="page-type" content="place" />
    <meta name="site-kind" content="other" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../system.css" />
    <style id="own-css">
      :root {
        --p-bg: #f9f5ea;
        --p-surface: #ebe4d2;
        --p-ink: #352c23;
        --p-accent: #805030;
        --p-action: #805030;
        --p-muted: #51554d;
        --p-action-ink: #fff;
      }
      .layout-work {
        color: var(--ink);
        background: var(--bg);
      }
      .layout-work h2 {
        max-width: 24ch;
        text-wrap: balance;
      }
      .layout-work .intro {
        max-width: 58ch;
        margin-block: var(--s-4) var(--s-7);
        color: var(--muted);
        font-size: var(--t-lead);
      }
      .layout-work figure,
      .layout-work dl,
      .layout-work dd {
        margin: 0;
      }
      .layout-work img {
        display: block;
        width: 100%;
        height: auto;
      }
      .layout-work .line {
        border-top: 1px solid var(--line);
        padding-block: var(--s-4);
      }
      .layout-work figcaption {
        padding-top: var(--s-3);
        font-size: var(--t-small);
      }
      .layout-work svg {
        display: block;
        width: 100%;
        height: auto;
      }
      @media (max-width: 650px) {
        .layout-work .intro {
          margin-bottom: var(--s-6);
        }
      }
      #bean-journal .journal article {
        display: grid;
        grid-template-columns: minmax(7em, 22%) 1fr;
        align-items: center;
        gap: var(--s-5);
      }
      #bean-journal .journal img {
        aspect-ratio: 2;
        object-fit: cover;
      }
      #bean-journal .journal {
        display: grid;
        grid-template-columns: 1.7fr 1fr;
        gap: 0 var(--s-6);
      }
      #bean-journal .journal article:first-child {
        grid-row: span 2;
        display: block;
      }
      #bean-journal .journal article:first-child img {
        aspect-ratio: 2.4;
        margin-bottom: var(--s-3);
      }
      #bean-journal .journal article:not(:first-child) {
        grid-template-columns: 35% 1fr;
      }
      #bean-journal .journal article:not(:first-child) img {
        aspect-ratio: 1.2;
      }
      @media (max-width: 650px) {
        #bean-journal .journal {
          display: block;
        }
      }
      .credit-line {
        display: block;
        font-size: var(--t-label);
        padding: var(--s-4) var(--gut);
        color: inherit;
      }
    </style>
  </head>

  <body>
    <main>
      <section
        class="section own layout-work"
        id="bean-journal"
        data-own="bean-journal"
        data-family="article-list"
        data-width="content"
        aria-labelledby="bean-journal-title"
      >
        <div class="wrap">
          <h2 id="bean-journal-title">From the roastery</h2>
          <p class="intro">
            Short field notes on picking coffee, brewing it and tasting the
            difference.
          </p>
          <div class="journal">
            <article class="line">
              <img
                src="../layout/img/photo-beans-hand.jpg"
                alt="A hand reaching for a heap of roasted coffee beans on a white table"
                width="960"
                height="640"
              />
              <div>
                <h3>Selecting a sample roast</h3>
                <p>At the sorting table</p>
              </div>
            </article>
            <article class="line">
              <img
                src="../layout/img/photo-c70.jpg"
                alt="Three white bowls of coffee beans, dark to light roast, in a row on a white surface, seen from above"
                width="960"
                height="640"
              />
              <div>
                <h3>Reading a roast by colour</h3>
                <p>Three sample batches</p>
              </div>
            </article>
            <article class="line">
              <img
                src="../layout/img/photo-c96.jpg"
                alt="Hot water poured from a copper gooseneck kettle into a pour-over dripper, jars and cups on a pale table, seen from above"
                width="960"
                height="640"
              />
              <div>
                <h3>Keeping a steady pour</h3>
                <p>At the filter bar</p>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>
    <small class="credit-line"
      >Photography · www.Pixel.la Free Stock Photos, Alorin, Kim Sanso</small
    >
  </body>
</html>
