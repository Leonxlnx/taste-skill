<style>
[data-own="media-desk"] {
  & .t-lead { margin: var(--s-4) 0 var(--head-gap); }
  & svg[width="0"] { position: absolute; }
  & button { background: transparent; border: 0; cursor: pointer; min-height: var(--btn-h); }
  & [role="tab"] { padding: var(--s-2) var(--s-4); border-bottom: 1px solid var(--line); }
  & [aria-selected="true"] { border-color: var(--ink); font-weight: 600; }
  & .format { margin-top: var(--s-4); }
  &[data-ready] .format { display: grid; grid-template-columns: repeat(12,minmax(0,1fr)); gap: var(--gutter); align-items: start; }
  & figure { grid-area: 1 / 1 / auto / span 8; }
  & .well { position: relative; display: grid; place-items: center; aspect-ratio: 16/9; background: var(--surface); border-radius: var(--r-md); overflow: hidden; }
  & .well svg, & video { width: 100%; height: 100%; }
  & .well:has([viewBox="0 0 64 80"]) { background: var(--ink); }
  & .well [viewBox="0 0 64 80"] { width: auto; aspect-ratio: 4/5; background: var(--surface); }
  & video { position: absolute; inset: 0; }
  & figcaption { margin-top: var(--s-4); }
  & figcaption b { font-size: var(--t-h3); font-weight: 500; }
  & small { display: block; font-size: var(--t-small); color: var(--muted); }
  & .choices { grid-area: 1 / 9 / auto / -1; display: grid; gap: var(--s-2); }
  & .choices button { display: grid; grid-template-columns: 36% 1fr; text-align: left; align-items: center; gap: var(--s-3); padding: var(--s-2); border-top: 1px solid var(--line); }
  & .choices svg { width: 100%; height: auto; aspect-ratio: 16/9; }
  & [aria-pressed="true"] { background: var(--surface); border-color: var(--ink); }
  & summary, & .download { min-height: var(--btn-h); align-content: center; color: var(--action); cursor: pointer; }
  & .download { display: inline-flex; align-items: center; text-decoration: underline; }
  & details p { font-variant-numeric: tabular-nums; }
  @media (max-width: 639px) {
    &[data-ready] .format { grid-template-columns: minmax(0,1fr); }
    & figure { grid-area: 1 / 1; }
    & .choices { grid-area: 2 / 1; grid-template-columns: repeat(2,minmax(0,1fr)); }
    & .choices button { grid-template-columns: 1fr; align-content: start; }
  }
}
</style>

<script type="module">
for (const root of document.querySelectorAll('[data-own="media-desk"]')) {
  if (root.hasAttribute('data-ready')) continue;
  const all = selector => [...root.querySelectorAll(selector)];
  const tabs = all('[role="tab"]'), groups = all('.format');
  if (document.getElementById(root.id) !== root) {
    const suffix = '-' + crypto.randomUUID();
    for (const el of [root, ...all('[id]')]) el.id += suffix;
    for (const use of all('use')) use.setAttribute('href', use.getAttribute('href') + suffix);
    root.setAttribute('aria-labelledby', root.querySelector('h2').id);
  }
  let player;
  function choose(group, index) {
    if (player) { player.pause(); player.remove(); player = null; }
    const buttons = group.querySelectorAll('button');
    const figures = group.querySelectorAll('figure');
    figures.forEach((figure, i) => {
      figure.hidden = i !== index;
      buttons[i].setAttribute('aria-pressed', String(i === index));
    });
    const item = figures[index], file = item.querySelector('.download');
    if (!file) return;
    player = document.createElement('video');
    player.controls = player.playsInline = true;
    player.preload = 'metadata';
    const poster = item.querySelector('svg').cloneNode(true);
    poster.replaceChildren(root.querySelector(poster.firstElementChild.getAttribute('href')).cloneNode(true));
    const colors = getComputedStyle(root);
    const xml = new XMLSerializer().serializeToString(poster).replace(/var\((--[\w-]+)\)/g, (_, name) => colors.getPropertyValue(name).trim());
    player.poster = 'data:image/svg+xml,' + encodeURIComponent(xml);
    player.setAttribute('aria-label', item.querySelector('b').textContent);
    player.src = file.href;
    const track = player.addTextTrack('captions','English','en');
    const beat = index ? 25 : 16;
    item.querySelectorAll('details p').forEach((p,i) => track.addCue(new VTTCue(i*beat,(i+1)*beat,p.textContent.slice(5))));
    track.mode = 'showing';
    player.onerror = event => { event.target.remove(); file.hidden = false; };
    item.querySelector('.well').append(player);
  }
  function format(index) {
    groups.forEach((group,i) => {
      group.hidden = index !== i;
      tabs[i].tabIndex = i === index ? 0 : -1;
      tabs[i].setAttribute('aria-selected', String(index === i));
    });
    choose(groups[index],0);
  }
  groups.forEach((group,i) => {
    const tab = tabs[i], choices = group.querySelector('.choices');
    tab.setAttribute('aria-controls', group.id);
    group.setAttribute('aria-labelledby', tab.id);
    group.setAttribute('role','tabpanel');
    group.querySelector('h3').hidden = true;
    tab.onclick = () => format(i);
    tab.onkeydown = event => {
      const next = {Home:0,End:1,ArrowLeft:1-i,ArrowRight:1-i}[event.key];
      if (next === undefined) return;
      event.preventDefault(); format(next); tabs[next].focus();
    };
    group.querySelectorAll('figure').forEach((figure,j) => {
      const button = document.createElement('button'), label = document.createElement('span');
      button.className = 'press';
      const meta = document.createElement('small');
      meta.textContent = figure.querySelector('small').textContent.split(' · ')[0];
      label.append(figure.querySelector('b').textContent, meta);
      button.append(figure.querySelector('svg').cloneNode(true), label);
      button.onclick = () => choose(group,j);
      choices.append(button);
    });
    choices.hidden = false;
  });
  format(0);
  for (const file of all('.download')) file.hidden = true;
  root.querySelector('[role="tablist"]').hidden = false;
  root.dataset.ready = '';
}
</script>
