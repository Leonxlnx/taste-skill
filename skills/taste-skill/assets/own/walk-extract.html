    <link rel="stylesheet" href="../system.css" />
    <style id="own-css">
      :root {
        --p-bg: #faf6ed;
        --p-surface: #efe6d6;
        --p-ink: #242922;
        --p-accent: #865220;
        --p-action: #865220;
        --p-muted: #51554d;
        --p-action-ink: #fff;
      }
      .layout-work {
        color: var(--ink);

      }
      .layout-work h2 {
        max-width: 24ch;
        text-wrap: balance;
      }

      .layout-work dd {

        width: 100%;
        height: auto;
      }
      .layout-work figcaption {
        padding-top: var(--s-3);
        font-size: var(--t-small);
      }
      .layout-work svg {
        display: block;
        width: 100%;
        height: auto;
      }
      @media (max-width: 650px) {
        .layout-work .intro {
          margin-bottom: var(--s-6);
        }

          <p class="intro">From the example notebook for Quarry Ridge.</p>
          <blockquote class="walk-quote">
            “At the fork above the quarry, take the grass path. The gravel track
