<style>
[data-own="evidence-grid"] .wrap > h2 + p { margin-top: var(--s-4); }
[data-own="evidence-grid"] .wrap > p + * { margin-top: var(--head-gap); }
[data-own="evidence-grid"] .proof-grid { display: grid; grid-template-columns: repeat(12,minmax(0,1fr)); gap: var(--card-gap); font-variant-numeric: tabular-nums; }
[data-own="evidence-grid"] .proof-grid > * { min-width: 0; padding: var(--s-5); border: 1px solid var(--line); border-radius: var(--r-md); }
[data-own="evidence-grid"] .spread { grid-column: span 8; }
[data-own="evidence-grid"] .proof-art { background: var(--surface); border-radius: var(--r-sm); padding: var(--s-3); }
[data-own="evidence-grid"] .proof-art svg { width: 100%; max-height: calc(var(--s-10) * 2); }
[data-own="evidence-grid"] figcaption { margin-top: var(--s-4); }
[data-own="evidence-grid"] figcaption p { color: var(--muted); }
[data-own="evidence-grid"] summary { cursor: pointer; min-height: var(--btn-h); align-content: center; color: var(--action); width: fit-content; }
[data-own="evidence-grid"] .dimensions { grid-column: span 4; background: var(--surface); display: flex; flex-direction: column; justify-content: space-between; gap: var(--s-3); }
[data-own="evidence-grid"] .corner { width: 100%; height: var(--s-8); margin-block: var(--s-2); }
[data-own="evidence-grid"] dl { margin: 0; }
[data-own="evidence-grid"] dt { color: var(--muted); font-size: var(--t-small); }
[data-own="evidence-grid"] dl > div { border-top: 1px solid var(--line); padding-block: var(--s-4); }
[data-own="evidence-grid"] dd { margin: var(--s-1) 0 0; font-size: var(--t-stat); line-height: 1.15; letter-spacing: var(--display-tracking); }
[data-own="evidence-grid"] dd small { font-size: var(--t-body); }
[data-own="evidence-grid"] .short { grid-column: span 6; display: flex; gap: var(--s-5); align-items: center; }
[data-own="evidence-grid"] .short svg { width: 25%; max-width: var(--s-10); }
[data-own="evidence-grid"] .short h3 { font-size: var(--t-card); }
@media (max-width: 1023px) { [data-own="evidence-grid"] .dimensions { padding: var(--s-4); } }
@media (max-width: 639px) {
  [data-own="evidence-grid"] .proof-grid > * { grid-column: 1 / -1; padding: var(--s-4); }
  [data-own="evidence-grid"] .dimensions { gap: var(--s-3); }
  [data-own="evidence-grid"] .corner { display: none; }
  [data-own="evidence-grid"] .dimensions dl { display: grid; grid-template-columns: 3fr 2fr; gap: var(--s-3); }
  [data-own="evidence-grid"] .dimensions dd { font-size: var(--t-h3); }
  [data-own="evidence-grid"] .proof-art { padding: var(--s-3); }
}
</style>

<script type="module">
const instances = [...document.querySelectorAll('[data-own="evidence-grid"]')];
for (const [index, root] of instances.entries()) {
  if (root.hasAttribute('data-bound')) continue;
  if (index && document.getElementById(root.id) !== root) {
    const suffix = '-' + (index + 1);
    root.setAttribute('aria-labelledby', root.getAttribute('aria-labelledby') + suffix);
    for (const el of [root, ...root.querySelectorAll('[id]')]) el.id += suffix;
  }
  root.dataset.bound = "";
}
</script>
