<!doctype html>
<!-- Three related destinations with distinct photographs and comparable distances. Desktop and phone section heights in the second comparison: 902px at 1440; 1015px at 390. The content stays inside the kit gutters. -->
<html lang="en" data-type="software" data-radius="sharp">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Three walks for a change of season · Footnote</title>
    <meta
      name="description"
      content="Three walks for a change of season at Footnote."
    />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../system.css" />
    <style id="own-css">
      :root {
        --p-bg: #faf6ed;
        --p-surface: #efe6d6;
        --p-ink: #242922;
        --p-accent: #865220;
        --p-action: #865220;
        --p-muted: #51554d;
        --p-action-ink: #fff;
      }
      .layout-work {
        color: var(--ink);
        background: var(--bg);
      }
      .layout-work h2 {
        max-width: 24ch;
        text-wrap: balance;
      }
      .layout-work .intro {
        max-width: 58ch;
        margin-block: var(--s-4) var(--s-7);
        color: var(--muted);
        font-size: var(--t-lead);
      }
      .layout-work figure,
      .layout-work dl,
      .layout-work dd {
        margin: 0;
      }
      .layout-work img {
        display: block;
        width: 100%;
        height: auto;
      }
      .layout-work .trio {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--s-5);
      }
      .layout-work figcaption {
        padding-top: var(--s-3);
        font-size: var(--t-small);
      }
      .layout-work svg {
        display: block;
        width: 100%;
        height: auto;
      }
      @media (max-width: 650px) {
        .layout-work .trio {
          grid-template-columns: 1fr;
        }

        .layout-work .intro {
          margin-bottom: var(--s-6);
        }
      }
      #trail-editions .trail-plates img {
        aspect-ratio: 4/5;
        object-fit: cover;
      }
      #trail-editions .trail-plates figcaption {
        font-size: var(--t-body);
      }
      @media (max-width: 650px) {
        #trail-editions .trail-plates img {
          aspect-ratio: 16/9;
        }
      }
      .credit-line {
        display: block;
        font-size: var(--t-label);
        padding: var(--s-4) var(--gut);
        color: inherit;
      }
    </style>
  </head>

  <body>
    <main>
      <section
        class="section own layout-work"
        id="trail-editions"
        data-own="trail-editions"
        data-family="photo-gallery"
        data-width="content"
        aria-labelledby="trail-editions-title"
      >
        <div class="wrap">
          <h2 id="trail-editions-title">Three walks for a change of season</h2>
          <p class="intro">
            Keep a short route on hand for the first frost, a clear autumn
            afternoon or a day under cloud.
          </p>
          <div class="trio trail-plates">
            <figure>
              <img
                src="../layout/img/photo-559.jpg"
                alt="Snow-covered lane lined with bare frosted trees"
                width="960"
                height="640"
              />
              <figcaption><strong>First frost</strong> · 4.1 km</figcaption>
            </figure>
            <figure>
              <img
                src="../layout/img/photo-d534.jpg"
                alt="Tree-lined forest lane under an arch of golden autumn beeches, with soft mist and leaves on the road"
                width="960"
                height="640"
              />
              <figcaption><strong>Beech hollow</strong> · 6.4 km</figcaption>
            </figure>
            <figure>
              <img
                src="../layout/img/photo-465.jpg"
                alt="Dark rocky peak emerging from thick white cloud"
                width="960"
                height="640"
              />
              <figcaption><strong>High pass</strong> · 8.2 km</figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>
    <small class="credit-line"
      >Photography · Ali Inay, Dietmar Rabich, Paula Vermeulen</small
    >
  </body>
</html>
