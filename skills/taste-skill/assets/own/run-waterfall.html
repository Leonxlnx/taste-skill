<!doctype html>
<!-- Parallel work with start and finish times. Show one run and a common time axis. Desktop and phone section heights in the second comparison: 799px at 1440; 648px at 390. The content stays inside the kit gutters. -->
<html lang="en" data-type="software" data-radius="sharp">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>See what held up a build · Trestle</title>
    <meta name="description" content="See what held up a build at Trestle." />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../system.css" />
    <style id="own-css">
      :root {
        --p-bg: #f6f5f0;
        --p-surface: #eae9df;
        --p-ink: #242c24;
        --p-accent: #4e604b;
        --p-action: #4e604b;
        --p-muted: #51554d;
        --p-action-ink: #fff;
      }
      .layout-work {
        color: var(--ink);
        background: var(--bg);
      }
      .layout-work h2 {
        max-width: 24ch;
        text-wrap: balance;
      }
      .layout-work .intro {
        max-width: 58ch;
        margin-block: var(--s-4) var(--s-7);
        color: var(--muted);
        font-size: var(--t-lead);
      }
      .layout-work figure,
      .layout-work dl,
      .layout-work dd {
        margin: 0;
      }
      .layout-work img {
        display: block;
        width: 100%;
        height: auto;
      }
      .layout-work figcaption {
        padding-top: var(--s-3);
        font-size: var(--t-small);
      }
      .layout-work svg {
        display: block;
        width: 100%;
        height: auto;
      }
      @media (max-width: 650px) {
        .layout-work .intro {
          margin-bottom: var(--s-6);
        }
      }
      #run-waterfall .run-stage {
        background: var(--ink);
        color: var(--bg);
        padding: var(--s-7);
      }
      #run-waterfall .run-stage header,
      #run-waterfall .ruler {
        display: flex;
        justify-content: space-between;
        gap: var(--s-3);
      }
      #run-waterfall .ruler {
        margin: var(--s-7) 0 var(--s-2) 24%;
        font-size: var(--t-label);
      }
      #run-waterfall .job {
        display: grid;
        grid-template-columns: 24% 1fr;
        border-top: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        align-items: center;
        min-height: var(--s-7);
      }
      #run-waterfall .job i {
        margin-left: var(--left);
        width: var(--duration);
        height: var(--s-3);
        background: #b8c9a4;
      }
      #run-waterfall .job:nth-last-child(2) i {
        background: #edc77f;
      }
      @media (max-width: 650px) {
        #run-waterfall .run-stage {
          padding: var(--s-4);
        }
        #run-waterfall .job {
          grid-template-columns: 34% 1fr;
          font-size: var(--t-small);
        }
        #run-waterfall .ruler {
          margin-left: 34%;
        }
      }
      #run-waterfall .job i {
        height: var(--s-4);
        border-inline-start: 2px solid var(--bg);
      }
      #run-waterfall .run-stage header strong {
        font-size: var(--t-card);
      }
    </style>
  </head>

  <body>
    <main>
      <section
        class="section own layout-work"
        id="run-waterfall"
        data-own="run-waterfall"
        data-family="wide-product-view"
        data-width="content"
        aria-labelledby="run-waterfall-title"
      >
        <div class="wrap">
          <h2 id="run-waterfall-title">See what held up a build</h2>
          <p class="intro">
            Trestle lays every job against the same clock. In this run, the
            browser tests finish last.
          </p>
          <figure class="run-stage">
            <header>
              <strong>Example run · Orchard</strong><span>4 min 12 s</span>
            </header>
            <div class="ruler">
              <span>0:00</span><span>1:03</span><span>2:06</span
              ><span>3:09</span><span>4:12</span>
            </div>
            <div class="job">
              <span>Prepare</span><i style="--left: 0%; --duration: 14%"></i>
            </div>
            <div class="job">
              <span>Compile</span><i style="--left: 14%; --duration: 31%"></i>
            </div>
            <div class="job">
              <span>Unit tests</span
              ><i style="--left: 45%; --duration: 22%"></i>
            </div>
            <div class="job">
              <span>Browser tests</span
              ><i style="--left: 45%; --duration: 55%"></i>
            </div>
            <div class="job">
              <span>Package</span><i style="--left: 67%; --duration: 16%"></i>
            </div>
          </figure>
        </div>
      </section>
    </main>
  </body>
</html>
