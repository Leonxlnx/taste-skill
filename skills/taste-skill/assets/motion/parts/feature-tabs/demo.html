<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Inside the field library · Folio</title>
    <link rel="stylesheet" href="../../../system.css" />
    <link rel="stylesheet" href="../../motion.css" />
    <link rel="stylesheet" href="../page.css" />
    <link rel="stylesheet" href="part.css" />
    <script defer src="part.js"></script>
  </head>
  <body>
    <main class="wrap">
      <section data-part="feature-tabs">
        <h1>Inside the field library</h1>
        <p class="intro">Browse the reference plates that accompany each workshop edition.</p>
        <div class="part-frame plates">
          <button class="pause loop-pause" hidden aria-label="Pause playback">Ⅱ</button>
          <div class="bar" data-choices hidden>
            <button>Ironwork<i></i></button><button>Drivetrain<i></i></button
            ><button>Bookbinding<i></i></button>
          </div>
          <div class="plates-media">
            <figure>
              <img
                class="visual"
                src="../../../photos/img/m130857602-1200.webp"
                alt="Anvil and forge tools"
              />
              <figcaption>Ironwork</figcaption>
            </figure>
            <figure>
              <img
                class="visual"
                src="../../../photos/img/m117663639-1200.webp"
                alt="Chain on a seven-speed cassette"
              />
              <figcaption>Drivetrain</figcaption>
            </figure>
            <figure>
              <img
                class="visual"
                src="../../../photos/img/m162973523-1200.webp"
                alt="Hand-gilding a blue book spine"
              />
              <figcaption>Bookbinding</figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
