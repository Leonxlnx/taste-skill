<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Studio licence · Folio</title>
    <link rel="stylesheet" href="../../../system.css" />
    <link rel="stylesheet" href="../../motion.css" />
    <link rel="stylesheet" href="../page.css" />
    <link rel="stylesheet" href="part.css" />
    <script defer src="part.js"></script>
  </head>
  <body>
    <main class="wrap">
      <section data-part="price-toggle">
        <h1>Studio licence</h1>
        <p class="intro">Choose a billing period for a shared edition workspace.</p>
        <div class="part-frame billing">
          <label hidden><input type="checkbox" role="switch" /> Bill yearly</label>
          <div class="row">
            <h3>Studio</h3>
            <div class="rates">
              <p>€24 <small>per month</small></p>
              <p>€240 <small>per year</small></p>
            </div>
          </div>
          <p>Includes proof history and shared production notes.</p>
        </div>
      </section>
    </main>
  </body>
</html>
