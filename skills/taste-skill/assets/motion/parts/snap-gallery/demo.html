<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Workshop plates · Folio</title>
    <link rel="stylesheet" href="../../../system.css" />
    <link rel="stylesheet" href="../../motion.css" />
    <link rel="stylesheet" href="../page.css" />
    <link rel="stylesheet" href="part.css" />
    <script defer src="part.js"></script>
  </head>
  <body>
    <main class="wrap">
      <section data-part="snap-gallery">
        <h1>Workshop plates</h1>
        <p class="intro">Inspect the material and tool studies collected for this edition.</p>
        <div class="part-frame gallery">
          <div class="gallery-track" tabindex="0" aria-label="Workshop photographs">
            <figure>
              <img
                class="visual"
                src="../../../photos/img/m130857602-1200.webp"
                alt="Anvil and forge tools"
              />
              <figcaption>Anvil and forge tools</figcaption>
            </figure>
            <figure>
              <img
                class="visual"
                src="../../../photos/img/m117663639-1200.webp"
                alt="Chain on a seven-speed cassette"
              />
              <figcaption>Chain on a seven-speed cassette</figcaption>
            </figure>
            <figure>
              <img
                class="visual"
                src="../../../photos/img/m162973523-1200.webp"
                alt="Hand-gilding a blue book spine"
              />
              <figcaption>Hand-gilding a blue book spine</figcaption>
            </figure>
          </div>
          <div class="bar gallery-nav" hidden>
            <button aria-label="Previous plate">←</button><button aria-label="Next plate">→</button
            ><span><i></i></span>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
