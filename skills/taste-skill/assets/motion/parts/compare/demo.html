<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Check the tonal proof · Folio</title>
    <link rel="stylesheet" href="../../../system.css" />
    <link rel="stylesheet" href="../../motion.css" />
    <link rel="stylesheet" href="../page.css" />
    <link rel="stylesheet" href="part.css" />
    <script defer src="part.js"></script>
  </head>
  <body>
    <main class="wrap">
      <section data-part="compare">
        <h1>Check the tonal proof</h1>
        <p class="intro">Compare the full-colour plate with its monochrome proof at the same crop.</p>
        <figure class="part-frame tonal">
          <div class="tonal-stack">
            <div>
              <img
                class="visual"
                src="../../../photos/img/m162973523-1200.webp"
                alt="Hand-gilding a blue book spine"
              /><span>Colour</span>
            </div>
            <div>
              <img
                class="visual"
                src="../../../photos/img/m162973523-1200.webp"
                alt="Hand-gilding a blue book spine"
              /><span>Monochrome</span>
            </div>
          </div>
          <label hidden>Proof boundary <input type="range" min="0" max="100" value="50" /></label>
        </figure>
      </section>
    </main>
  </body>
</html>
