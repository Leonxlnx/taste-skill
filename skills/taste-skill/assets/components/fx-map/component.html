<section class="cx cx-map" aria-label="Where to find us" data-cx-map="fx-map/sample-map.json">
  <div class="cx-map__ground">
    <svg class="cx-map__svg" role="img" aria-label="Street map of Leith: Harbour Works on Sandport Street"></svg>
    <div class="cx-map__pin" aria-hidden="true">
      <span class="cx-map__halo"></span>
      <span class="cx-map__dot"></span>
      <span class="cx-map__tag">Harbour Works</span>
    </div>
    <div class="cx-map__scale" aria-hidden="true"><span></span>200 m</div>
  </div>
  <div class="cx-map__card">
    <span class="cx-eyebrow">Studio</span>
    <h3 class="cx-title">Harbour Works</h3>
    <address class="cx-map__addr">Sandport Street, Leith<br>Edinburgh</address>
    <p class="cx-map__line"><span class="cx-map__open" aria-hidden="true"></span>Open today, 9:00 to 18:00</p>
    <div class="cx-map__actions">
      <a class="btn btn--primary btn--sm" href="https://www.openstreetmap.org/search?query=Sandport%20Street%20Leith" target="_blank" rel="noopener">Get directions<span class="cx-sr"> (opens OpenStreetMap)</span></a>
      <button class="btn btn--secondary btn--sm" type="button" data-copy="Sandport Street, Leith, Edinburgh">Copy address</button>
    </div>
  </div>
</section>
