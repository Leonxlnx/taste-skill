<form class="cx cx-prompt" data-cx-seed="3" onsubmit="return false">
  <div class="cx-prompt__box">
    <label class="cx-sr" for="cx-prompt-input">Ask about your account</label>
    <textarea id="cx-prompt-input" class="cx-prompt__input" rows="2" placeholder="Ask about an invoice, a payout or a customer"></textarea>
    <div class="cx-prompt__bar">
      <button type="button" class="cx-prompt__tool" aria-label="Attach a file">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10.5 4.5 5.6 9.4a1.4 1.4 0 0 0 2 2l5-5a2.8 2.8 0 0 0-4-4l-5 5a4.2 4.2 0 0 0 6 6l4.4-4.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <span class="cx-prompt__chip"><span class="cx-prompt__dot" aria-hidden="true"></span>Ledger data</span>
      <button type="submit" class="cx-prompt__send" aria-label="Send">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 13V3.5M3.5 8 8 3.5 12.5 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
  <ul class="cx-prompt__hints" aria-label="Examples">
    <li><button type="button">Unpaid invoices over 30 days</button></li>
    <li><button type="button">Refunds this week</button></li>
  </ul>
</form>
