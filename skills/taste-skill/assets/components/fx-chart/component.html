<article class="cx cx-card cx-chart" data-cx-seed="12">
  <header class="cx-chart__head">
    <div>
      <h3 class="cx-chart__title">API requests</h3>
      <p class="cx-chart__sub">Last 14 days, all regions</p>
    </div>
    <div class="cx-chart__total">
      <span class="cx-chart__label">Total</span>
      <span class="cx-chart__value cx-num" data-total>27.8M</span>
      <span class="cx-chart__delta">+12.4% on the 14 days before</span>
    </div>
  </header>
  <div class="cx-chart__plot" tabindex="0" role="img" aria-label="Area chart of requests per day for the last 14 days. Use the left and right arrow keys to read each day.">
    <div class="cx-chart__grid" aria-hidden="true"></div>
    <div class="cx-chart__area" aria-hidden="true"></div>
    <svg class="cx-chart__line" aria-hidden="true" preserveAspectRatio="none"><path/></svg>
    <div class="cx-chart__cursor" aria-hidden="true"><span class="cx-chart__dot"></span></div>
    <div class="cx-chart__tip" aria-live="polite"></div>
  </div>
  <div class="cx-chart__axis" aria-hidden="true"></div>
  <table class="cx-sr" data-table>
    <caption>Requests per day</caption>
    <tbody></tbody>
  </table>
</article>
