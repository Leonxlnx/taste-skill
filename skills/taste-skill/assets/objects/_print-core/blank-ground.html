<!doctype html>
<html lang="en">
<head>
<script>window.__tpGlMax = 16;   /* a gallery shows many live effects at once; a page of a site keeps the default 4 (fx.js) */</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Objects over blank grounds</title>
<meta name="description" content="A test: objects on grounds that never draw lay the ground's paper themselves, and give it back once a ground draws.">
<link rel="stylesheet" href="../../ui/base.css">
<link rel="stylesheet" href="../../ui/cards.css">
<style>
  :root { --bg: #f3f3f1; --card: #ffffff; --ink: #0f0f0e; --muted: #686863; --accent: #e5531c; --accent-ink: #ffffff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { padding: 24px; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, sans-serif; }
  .g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .card > .panel--top { aspect-ratio: auto; height: 340px; min-height: 0; }
  @media (max-width: 900px) { .g3 { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<!--
  Maintainers only. A clear object on a [data-fx] ground prints in that ground's colours; until the
  ground draws, the object lays the ground's paper itself (data-print-paper="own"), so a dark-paper
  print never stands on a pale, undrawn panel. The first two grounds here never draw; the third is
  drawn by ui.grounds and its object must give the paper back (data-print-paper="ground").
  window.__blankGround holds the result: { ok, rows: [{ id, want, paper, fill }] }; data-ready is set.
-->
<div class="g3">
  <article class="card">
    <div class="panel panel--top" data-fx="grain-gradient" data-fx-seed="9" data-test-blank data-fx-palette='{"bg":"#1a2230","surface":"#232d3d","ink":"#e8ecf2","muted":"#8d97a6","accent":"#5a8fd0"}'>
      <div data-print="print-lamp" data-print-place="tile" data-print-params='{"effect":"dither","step":1}'></div>
    </div>
    <h3>Dark ground, never drawn</h3>
  </article>
  <article class="card">
    <div class="panel panel--top" data-fx="grain-gradient" data-fx-seed="5" data-test-blank data-fx-palette='{"bg":"#c6d3df","surface":"#e1e8ee","ink":"#25303a","muted":"#5d6873","accent":"#3f6a92"}'>
      <div data-print="print-cup" data-print-place="tile"></div>
    </div>
    <h3>Light ground, never drawn</h3>
  </article>
  <article class="card">
    <div class="panel panel--top" data-fx="grain-gradient" data-fx-seed="21" data-fx-palette='{"bg":"#1a2230","surface":"#232d3d","ink":"#e8ecf2","muted":"#8d97a6","accent":"#5a8fd0"}' data-fx-params='{"speed":0,"grainMotion":0}'>
      <div data-print="print-globe" data-print-place="tile" data-print-params='{"effect":"engrave"}'></div>
    </div>
    <h3>Dark ground, drawn</h3>
  </article>
</div>
<script type="module">
  import fx from '../../effects/fx.js';
  import ui from '../../ui/ui.js';
  import auto from './auto.js';
  const root = document.documentElement;
  await auto.mountAll(document);
  // only the third ground is drawn; the first two stay blank on purpose
  await ui.grounds(document, fx, { skip: el => el.hasAttribute('data-test-blank') });
  const hex = c => { const m = c.match(/\d+/g); return m ? '#' + m.slice(0, 3).map(v => (+v).toString(16).padStart(2, '0')).join('') : ''; };
  const check = () => [...document.querySelectorAll('[data-print]')].map(el => {
    const g = el.closest('[data-fx]'), want = g.hasAttribute('data-test-blank') ? 'own' : 'ground';
    return { id: el.dataset.print, want, paper: el.dataset.printPaper, fill: hex(getComputedStyle(el).backgroundColor), groundBg: JSON.parse(g.dataset.fxPalette).bg };
  });
  // the third ground's bake can take a few seconds on a CPU renderer
  for (let i = 0; i < 100; i++) { const r = check(); if (r.every(x => x.paper === x.want)) break; await new Promise(r => setTimeout(r, 200)); }
  const rows = check();
  const ok = rows.every(r => r.paper === r.want && (r.want === 'ground' || r.fill === r.groundBg));
  window.__blankGround = { ok, rows };
  root.dataset.ready = ok ? 'pass' : 'fail';
</script>
</body>
</html>
