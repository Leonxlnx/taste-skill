<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material tools</title><link rel="stylesheet" href="../assets/system.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#282b28;font:16px/1.45 system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:44px 4vw}header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #bfc4bc;padding-bottom:20px}h1,h2{margin:0;letter-spacing:-.045em}h1{font-size:32px}a{color:inherit}.workspace{display:grid;grid-template-columns:152px minmax(0,1fr) 222px;gap:28px;margin-top:28px}nav,aside{display:grid;align-content:start;gap:10px}button,select,input{font:inherit;color:inherit}button,select{border:1px solid #c6c9c1;background:transparent;border-radius:5px;padding:7px 12px;cursor:pointer}nav button{text-align:left;border-color:transparent}nav [aria-pressed=true]{background:#dfe3da}label{display:grid;gap:4px;font-size:14px}input[type=number]{border:1px solid #c6c9c1;border-radius:5px;padding:6px 11px;background:transparent}.reading{float:right;color:#60675f;font-variant-numeric:tabular-nums}input{max-width:100%;accent-color:#42634b}figure{margin:12px 0}figcaption{font-size:13px;margin-top:4px}.stage{height:190px;display:grid;place-items:center;overflow:hidden}.sample{width:72%;height:63%;display:grid;place-items:center}footer{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}select{width:100%}output{display:block;min-height:1.5em;margin-top:12px}@media(max-width:780px){.workspace{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap}aside{grid-row:2;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}main{padding:20px}}
</style></head><body><main><header><h1>Material tools</h1><a href="demo.html">View example</a></header><div class="workspace"><nav aria-label="Generators"></nav><article><h2 id="title"></h2><div id="previews"></div><footer><button data-copy="css">Copy CSS</button><button data-copy="svg">Copy SVG</button><button data-copy="command">Copy command</button></footer><output aria-live="polite"></output></article><aside aria-label="Settings"></aside></div></main><script src="lab-bundle.js"></script><script src="lab.js"></script></body></html>
