name: Check skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every SKILL.md frontmatter parses (as Claude Code and Codex parse it)
        run: |
          npm install --no-save --no-package-lock yaml@2.6.1
          node tests/frontmatter.mjs
      - name: Text files are clean UTF-8 (no double encoding)
        run: node tests/text-encoding.mjs
      - name: Every file path the docs point at exists
        run: node tests/doc-links.mjs
      - name: Scripts parse
        run: |
          node -e '
            const fs = require("node:fs"), path = require("node:path"), { execFileSync } = require("node:child_process");
            const walk = d => fs.readdirSync(d, { withFileTypes: true }).flatMap(e => {
              const p = path.join(d, e.name);
              return e.isDirectory() ? walk(p) : /\.(mjs|js)$/i.test(e.name) ? [p] : [];
            });
            for (const f of [...walk("skills/taste-skill/scripts"), ...walk("skills/taste-skill/assets")]) {
              execFileSync(process.execPath, ["--check", f], { stdio: "inherit" });
            }
          '

  # install.sh is the one script a user runs before anything else, and it is the one script
  # nothing else exercises. It has to work on the bash a machine actually ships: macOS still
  # carries bash 3.2 as /bin/bash, and a bash 4 construct there fails at the user's desk, not
  # in CI. So it is run on both, with the real paths it takes: list, install, uninstall.
  installer:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install.sh lists, installs and uninstalls
        run: ./tests/installer_test.sh
